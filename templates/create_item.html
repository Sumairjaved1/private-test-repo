{% extends "base.html" %}

{% block title %}Create Item{% endblock %}

{% block content %}
<div class="container">
    <h2 class="text-center">Create Item</h2>
    {% if error %}
        <p class="text-danger text-center">{{ error }}</p>
    {% endif %}
    <form action="/item/create" method="POST" class="mt-3">
        <div class="mb-3">
            <label for="id" class="form-label">Item ID</label>
            <input type="text" id="id" name="id" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="value" class="form-label">Item Value</label>
            <input type="text" id="value" name="value" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Create Item</button>
    </form>
</div>
{% endblock %}
