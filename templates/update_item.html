<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Update Item</h1>

        <form action="/item/{{ item_id }}/update" method="POST">
            <div class="mb-3">
                <label for="item-value" class="form-label">Value</label>
                <input type="text" class="form-control" id="item-value" name="value" value="{{ item_value }}" required>
            </div>
            <button type="submit" class="btn btn-warning w-100">Update Item</button>
        </form>
    </div>
</body>
</html>
